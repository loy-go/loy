version: 2

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - whitespace

linters-settings:
  govet:
    enable-all: false
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-dirs:
    - testdata
    - vendor
  max-issues-per-linter: 50
  max-same-issues: 10
