version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - whitespace
  settings:
    govet:
      enable-all: false
      disable:
        - fieldalignment
    errcheck:
      check-type-assertions: false
      check-blank: false
  exclusions:
    paths:
      - testdata
      - vendor

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
